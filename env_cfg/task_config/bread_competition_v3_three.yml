# Supplementary dataset: only three-bread episodes, stored under its own
# task-config name so it cannot overwrite either mixed-count collection.
render_freq: 0
episode_num: 100
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
bread_count_range: [3, 3]
bread_hold_seconds: 2.0
square_bread_rate: 0.8
bread_stack_clearance: 0.005
bread_arm_handoff_seconds: 1.0
language_num: 100
eval_instruction: unseen
domain_randomization:
  random_background: true
  cluttered_table: false
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
