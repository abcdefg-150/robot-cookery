      table:
        dims:
        - 0.7
        - 2.0
        - 0.04
        pose:
        - 0.45
        - 0
        - -0.02
        - 1
        - 0
        - 0
        - 0
  reuse_sequential_motion_gen: true
  continuous_urdf_trajectory: true
  trajectory_velocity_limits:
